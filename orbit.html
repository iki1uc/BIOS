<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>NC‑BIOS 2.0 – Orbit</title>

<style>
body {
    background:#000;
    color:#0f0;
    font-family:monospace;
    text-align:center;
    padding-top:80px;
}

#orbit {
    font-size:32px;
    animation:pulse 1.8s infinite;
}

@keyframes pulse {
    0% { opacity:0.3; transform:scale(0.9); }
    50% { opacity:1; transform:scale(1.1); }
    100% { opacity:0.3; transform:scale(0.9); }
}
</style>
</head>

<body>
<div id="orbit">Q2 – Orbit<br>NC‑Umlauf / Bewegung</div>
</body>
